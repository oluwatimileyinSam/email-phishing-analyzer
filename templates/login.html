<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; color: #1b1f24; margin: 0; }
    .wrap { max-width: 420px; margin: 0 auto; padding: 48px 16px; }
    h1 { font-size: 24px; margin-bottom: 4px; }
    .sub { color: #5a6270; margin-top: 0; }
    .card { background: #ffffff; border: 1px solid #d9dee5; border-radius: 8px; padding: 18px; margin-top: 16px; }
    .error { background: #fdecea; border-color: #e5a29b; }
    input[type=password] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; margin-bottom: 12px; }
    button { background: #1f3a5f; color: #ffffff; border: 0; border-radius: 6px; padding: 8px 16px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Email Phishing Analyzer</h1>
    <p class="sub">Enter the password to continue.</p>

    {% if error %}
    <div class="card error">{{ error }}</div>
    {% endif %}

    <div class="card">
      <form method="post">
        <input type="password" name="password" autofocus>
        <button type="submit">Log in</button>
      </form>
    </div>
  </div>
</body>
</html>
